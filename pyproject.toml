[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgvector-hybrid-engine"
version = "0.1.0"
description = "Production PostgreSQL 16 + pgvector Hybrid Dense-Sparse Retrieval Engine with Reciprocal Rank Fusion (RRF)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Chethan Raj D S", email = "chethanraj.d.s@gmail.com" }
]
dependencies = [
    "pydantic>=2.6.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
